server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: shophub-backend

  # ─── Database Configuration (Default: H2 in-memory, Override via DATABASE_URL) ─────
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:shophub;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  # ─── File Upload ───────────────────────────────────────────────────────────
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 100MB

# ─── Application Properties ─────────────────────────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET:c2hvcGh1Yi1zZWNyZXQta2V5LWZvci1qd3QtYXV0aGVudGljYXRpb24tcHJhdGlrLXNoaW5kZQ==}
    expiration-ms: 86400000   # 24 hours

  google:
    client-id: ${GOOGLE_CLIENT_ID:mock-google-client-id}

  tigris:
    endpoint: ${TIGRIS_ENDPOINT:https://fly.storage.tigris.dev}
    access-key: ${TIGRIS_ACCESS_KEY:mock_access_key}
    secret-key: ${TIGRIS_SECRET_KEY:mock_secret_key}
    bucket-name: ${TIGRIS_BUCKET_NAME:shophub-products}

  cache:
    products-ttl-minutes: 10

# ─── Swagger ─────────────────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
